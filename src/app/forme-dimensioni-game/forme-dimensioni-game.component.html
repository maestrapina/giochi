<div class="game-page">
<header class="game-header"><button class="round-button" (click)="tornaHome()">🏠</button><div class="progress-wrapper"><div>{{avanzamento}}</div><div class="stars"><span *ngFor="let d of domande;let i=index" class="star" [class.completed]="i<stelle">★</span></div></div><button class="round-button" (click)="leggiConsegna()">🔊</button></header>

<main *ngIf="!giocoTerminato" class="game-card">
<section class="instruction-box"><button class="speaker-button" (click)="leggiConsegna()">🔊</button><div><div class="level-chip">{{titolo}}</div><h1>{{domandaCorrente.tipo==='dimensione'?'Confronta le due palle':'Confronta le quantità'}}</h1></div></section>

<section class="scene dimension-scene" *ngIf="domandaCorrente.tipo==='dimensione'">
  <button class="object-choice" [class.selected]="rispostaSelezionata===(domandaCorrente.ordine==='grande-sx'?'grande':'piccolo')" (click)="seleziona(domandaCorrente.ordine==='grande-sx'?'grande':'piccolo')">
    <span class="ball" [class.big]="domandaCorrente.ordine==='grande-sx'" [class.small]="domandaCorrente.ordine!=='grande-sx'">⚽</span>
  </button>
  <button class="object-choice" [class.selected]="rispostaSelezionata===(domandaCorrente.ordine==='grande-dx'?'grande':'piccolo')" (click)="seleziona(domandaCorrente.ordine==='grande-dx'?'grande':'piccolo')">
    <span class="ball" [class.big]="domandaCorrente.ordine==='grande-dx'" [class.small]="domandaCorrente.ordine!=='grande-dx'">⚽</span>
  </button>
</section>

<section class="scene quantity-scene" *ngIf="domandaCorrente.tipo==='quantita'">
  <button class="group-choice" [class.selected]="rispostaSelezionata==='uno'" (click)="seleziona('uno')">
    <span *ngIf="domandaCorrente.oggetto==='mele'">🍎</span><span *ngIf="domandaCorrente.oggetto==='stelle'">⭐</span><span *ngIf="domandaCorrente.oggetto==='palline'">🔵</span>
  </button>
  <button class="group-choice" [class.selected]="rispostaSelezionata==='pochi'" (click)="seleziona('pochi')">
    <ng-container *ngFor="let i of [1,2,3]"><span *ngIf="domandaCorrente.oggetto==='mele'">🍎</span><span *ngIf="domandaCorrente.oggetto==='stelle'">⭐</span><span *ngIf="domandaCorrente.oggetto==='palline'">🔵</span></ng-container>
  </button>
  <button class="group-choice many" [class.selected]="rispostaSelezionata==='tanti'" (click)="seleziona('tanti')">
    <ng-container *ngFor="let i of [1,2,3,4,5,6,7]"><span *ngIf="domandaCorrente.oggetto==='mele'">🍎</span><span *ngIf="domandaCorrente.oggetto==='stelle'">⭐</span><span *ngIf="domandaCorrente.oggetto==='palline'">🔵</span></ng-container>
  </button>
</section>

<div *ngIf="rispostaSelezionata" class="selection-note">🔊 {{etichetta(rispostaSelezionata)}} — tocca ancora per confermare</div>
<div *ngIf="feedback==='corretto'" class="feedback correct"><div>⭐ ⭐ ⭐</div><strong>BRAVISSIMO!</strong><div>🎉</div></div>
<div *ngIf="feedback==='sbagliato'" class="feedback retry"><div>💛</div><strong>RIPROVA!</strong></div>
</main>

<main *ngIf="giocoTerminato" class="finish-screen"><div class="finish-emoji">🍎</div><h1>Bravissimo!</h1><div class="finish-stars">⭐ ⭐ ⭐ ⭐ ⭐</div><div class="finish-buttons"><button class="play-again" (click)="ricomincia()">🔄 Gioca ancora</button><button class="home-again" (click)="tornaHome()">🏠</button></div></main>
</div>
